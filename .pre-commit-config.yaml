# Shared hooks for every project in this repo (seed-pipeline, backend, frontend).
# Install once from the repo root: `uv run pre-commit install`.
# Frontend hooks need `npm ci` in frontend/ first.
# Specs and plans under backend/docs/superpowers are immutable records; hooks never rewrite them.
exclude: '.*(data/|\.venv/|ai-models/|\.agents/|node_modules/|backend/docs/superpowers/)'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # SSE contract fixtures are byte-exact wire recordings: every frame ends with a blank line.
      - id: trailing-whitespace
        exclude: ^backend/tests/contract/fixtures/.*\.sse$
      - id: end-of-file-fixer
        exclude: ^backend/tests/contract/fixtures/.*\.sse$
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyrefly-seed-pipeline
        name: pyrefly check (seed-pipeline)
        entry: uv run --directory seed-pipeline pyrefly check --min-severity warn
        language: system
        files: ^seed-pipeline/.*\.(py|pyi|toml)$
        pass_filenames: false
        require_serial: true
      - id: pyrefly-backend
        name: pyrefly check (backend)
        entry: uv run --directory backend pyrefly check --min-severity warn
        language: system
        files: ^backend/.*\.(py|pyi|toml)$
        pass_filenames: false
        require_serial: true

  - repo: local
    hooks:
      - id: frontend-lint
        name: oxlint --type-aware (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(ts|tsx|js|mjs|json)$
        pass_filenames: false
        require_serial: true
      - id: frontend-format
        name: prettier --check (frontend)
        entry: npm --prefix frontend run format
        language: system
        files: ^frontend/
        pass_filenames: false
        require_serial: true
      - id: frontend-typecheck
        name: typecheck (frontend)
        entry: npm --prefix frontend run typecheck
        language: system
        files: ^frontend/.*\.(ts|tsx|json)$
        pass_filenames: false
        require_serial: true
      - id: frontend-api-drift
        name: orval output matches openapi.json (frontend)
        entry: npm --prefix frontend run api:check
        language: system
        files: ^frontend/(openapi\.json|orval\.config\.ts|app/api/gen/)
        pass_filenames: false
        require_serial: true

  - repo: local
    hooks:
      # Pinned image; the upstream hadolint-docker hook always pulls the latest tag.
      - id: hadolint
        name: hadolint (Dockerfiles)
        entry: ghcr.io/hadolint/hadolint:v2.15.1 hadolint
        language: docker_image
        types: [dockerfile]
        # identify also tags Dockerfile.dockerignore as a Dockerfile.
        files: (^|/)Dockerfile$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.13
    hooks:
      # One lock for the whole workspace, so a change to any member's pyproject.toml relocks it.
      - id: uv-lock
        files: ^(uv\.lock|pyproject\.toml|(backend|seed-pipeline)/pyproject\.toml)$
