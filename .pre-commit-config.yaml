# Shared hooks for every project in this repo (corpus-pipeline, backend).
# Install once from the repo root: `uv run --project backend pre-commit install`.
exclude: '.*(data/|\.venv/|ai-models/|\.agents/)'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyrefly-corpus-pipeline
        name: pyrefly check (corpus-pipeline)
        entry: uv run --directory corpus-pipeline pyrefly check --min-severity warn
        language: system
        files: ^corpus-pipeline/.*\.(py|pyi|toml)$
        pass_filenames: false
        require_serial: true
      - id: pyrefly-backend
        name: pyrefly check (backend)
        entry: uv run --directory backend pyrefly check --min-severity warn
        language: system
        files: ^backend/.*\.(py|pyi|toml)$
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.13
    hooks:
      - id: uv-lock
        name: uv-lock (corpus-pipeline)
        args: [--project, corpus-pipeline]
        files: ^corpus-pipeline/(uv\.lock|pyproject\.toml|uv\.toml)$
      - id: uv-lock
        name: uv-lock (backend)
        args: [--project, backend]
        files: ^backend/(uv\.lock|pyproject\.toml|uv\.toml)$
