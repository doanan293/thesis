[project]
name = "pharma-agent"
version = "0.1.0"
description = "Pharma AI agent backend over the Vietnamese National Drug Formulary corpus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "langfuse>=4.0,<5",
    "langgraph>=1.2,<2",
    "openai>=3.0,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0",
    "qdrant-client[fastembed]>=1.19,<2",
    "typer>=0.21",
]

[project.scripts]
pharma-agent = "pharma_agent.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=4.5",
    "pyrefly>=1.3",
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "respx>=0.23",
    "ruff>=0.15",
    "testcontainers>=4.15",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs Docker (run with -m integration)"]
addopts = ["--import-mode=importlib", "-m", "not integration"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "RUF012", "SIM117"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "typer.Option", "typer.Argument"]

[tool.ruff.format]
docstring-code-format = true
