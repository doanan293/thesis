[project]
name = "pharma-agent"
version = "0.1.0"
description = "Pharma AI agent backend over the Vietnamese National Drug Formulary corpus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19,<2",
    "fastapi>=0.141,<1",
    "fastapi-users[oauth,sqlalchemy]>=15.0,<16",
    "httpx>=0.27,<1",
    "langchain>=1.4,<2",
    "langfuse>=4.0,<5",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "openai>=3.0,<4",
    "psycopg[binary,pool]>=3.3,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0",
    "qdrant-client[fastembed]>=1.19,<2",
    "skills-ref>=0.1.1,<0.2",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "sse-starlette>=3.4,<4",
    "typer>=0.21",
    "uvicorn>=0.52,<1",
]

[project.scripts]
pharma-agent = "pharma_agent.cli:app"

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pyrefly==1.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.16.7",
    "testcontainers==4.15.0",
    "types-PyYAML==6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
extend = "../ruff.toml"
src = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs Docker (run with -m integration)"]
addopts = ["--import-mode=importlib", "-m", "not integration"]
filterwarnings = ["error"]
