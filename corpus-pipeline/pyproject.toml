[project]
name = "corpus-pipeline"
version = "0.1.0"
description = "Utilities for preparing the 2018 Vietnamese National Drug Formulary RAG corpus."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.15.0",
    "docling-ibm-models==3.13.3",
    "docling-parse==6.2.0",
    "docling-slim==2.102.1",
    "lxml==6.1.1",
    "mail-parser==4.4.0",
    "marko==2.2.3",
    "openpyxl==3.1.5",
    "PyMuPDF==1.27.2.3",
    "pylatexenc==2.10",
    "pypdfium2==5.10.1",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "qdrant-client==1.18.0",
    "kaggle==2.2.3",
    "requests==2.34.2",
    "typer==0.21.2",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "zstandard==0.25.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "RUF",
]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "E402", "E741", "SIM102", "B904", "B020"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011", "B023", "RUF012", "SIM117"]

[tool.ruff.format]
docstring-code-format = true

[dependency-groups]
dev = [
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pyrefly==1.1.1",
    "ruff==0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/corpus_pipeline",
]

[project.scripts]
corpus = "corpus_pipeline.cli.app:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
