[project]
name = "corpus-pipeline"
version = "0.1.0"
description = "Utilities for preparing the 2018 Vietnamese National Drug Formulary RAG corpus."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "docling-ibm-models>=3.0.0",
    "docling-parse>=6.0.0",
    "docling-slim>=2.48.0",
    "lxml>=5.0.0",
    "mail-parser>=4.0.0",
    "marko>=2.0.0",
    "openpyxl>=3.1.0",
    "PyMuPDF>=1.26.0",
    "pylatexenc>=2.10",
    "pypdfium2>=5.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "psycopg[binary]>=3.2.0",
    "qdrant-client>=1.18.0",
    "kaggle>=2,<3",
    "requests>=2.32.0,<3",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "zstandard>=0.23,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "RUF",
]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "E402", "E741", "SIM102", "B904", "B020"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011", "B023", "RUF012", "SIM117"]

[tool.ruff.format]
docstring-code-format = true

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pyrefly>=0.64.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/canonical",
    "src/artifact_lifecycle",
    "src/cli",
    "src/config",
    "src/corpus",
    "src/evaluation",
    "src/kaggle_vector_cache",
    "src/postgres_store",
    "src/rag_metadata",
    "src/tables",
    "src/validation",
    "src/vector_store",
    "src/pipeline",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
