# Single origin for the browser: /api/ goes to FastAPI, everything else to React Router.
# Mounted as /etc/nginx/conf.d, so it replaces the image's default server.

# Docker's embedded DNS. `resolve` keeps re-resolving the service names, so a recreated
# backend or frontend container (new IP address) needs no nginx restart.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream frontend {
    zone frontend 64k;
    server frontend:3000 resolve;
    keepalive 16;
}

upstream backend {
    zone backend 64k;
    server backend:8000 resolve;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI SDK UI Message Stream (SSE): pass each chunk through immediately.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
