# Local stack for the pharma agent on a CPU-only machine (Intel i5-13420H, 12 threads).
# Model files, ports and CPU tuning come from the root .env (see .env.example), so lighter
# GGUF files can be swapped in without editing this file.
name: thesis

x-llama-server: &llama-server
  image: ghcr.io/ggml-org/llama.cpp:server-b10920
  entrypoint: ["/bin/sh", "/opt/llama/start-server.sh"]
  volumes:
    - "${GGUF_DIR:-./ai-models/gguf}:/models:ro"
    - "./docker/llama-cpp-cpu/start-server.sh:/opt/llama/start-server.sh:ro"
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
    interval: 15s
    timeout: 5s
    retries: 5
    # Loading a 4B fp16 model from disk takes minutes on this machine.
    start_period: 10m
    start_interval: 5s
  restart: unless-stopped

x-backend: &backend
  build:
    context: ./backend
  image: thesis-pharma-agent:local
  # Host networking is the only way a container reaches the LLM proxy that listens on the
  # Windows host's 127.0.0.1 (WSL networkingMode=mirrored). Other services are reached
  # through their published ports, so the URLs below follow the same port variables.
  network_mode: host
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    PHARMA_API__HOST: "0.0.0.0"
    PHARMA_API__PORT: "${BACKEND_PORT:-8000}"
    PHARMA_POSTGRES__DSN: "postgresql+psycopg://${POSTGRES_USER:-thesis}:${POSTGRES_PASSWORD:-thesis}@127.0.0.1:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-thesis}"
    PHARMA_QDRANT__URL: "http://127.0.0.1:${QDRANT_HTTP_PORT:-6333}"
    PHARMA_RETRIEVAL__EMBEDDING__BASE_URL: "http://127.0.0.1:${LLAMA_EMBEDDING_PORT:-11434}/v1"
    PHARMA_RETRIEVAL__EMBEDDING__MODEL: "${LLAMA_EMBEDDING_MODEL_NAME:-qwen3-embedding:4b-fp16}"
    PHARMA_RETRIEVAL__RERANK__BASE_URL: "http://127.0.0.1:${LLAMA_RERANKER_PORT:-11435}"
    PHARMA_RETRIEVAL__RERANK__MODEL: "${LLAMA_RERANKER_MODEL_NAME:-qwen3-reranker:4b-fp16}"
    PHARMA_RETRIEVAL__RERANK__PROTOCOL: "${LLAMA_RERANKER_PROTOCOL:-completion_logprobs}"
    # One request per reranker slot; more concurrent requests only queue on the server.
    PHARMA_RETRIEVAL__RERANK__MAX_CONCURRENT: "${LLAMA_RERANKER_PARALLEL:-1}"
    # CPU profile: rerank only the best RRF candidates (RRF alone puts 95.7% of answers in top 10).
    PHARMA_RETRIEVAL__RERANK__MAX_CANDIDATES: "${RERANK_MAX_CANDIDATES:-15}"

services:
  llama-embedding:
    <<: *llama-server
    container_name: llama_embedding_cpu
    ports:
      - "${LLAMA_EMBEDDING_PORT:-11434}:8080"
    environment:
      LLAMA_MODEL: "/models/${LLAMA_EMBEDDING_MODEL:-qwen3-embedding-4b-fp16.gguf}"
      LLAMA_ROLE_PROTOCOL: "embedding"
      LLAMA_PARALLEL: "${LLAMA_EMBEDDING_PARALLEL:-1}"
      LLAMA_CONTEXT_PER_SLOT: "${LLAMA_EMBEDDING_CONTEXT_PER_SLOT:-2048}"
      # Only short user queries are embedded at runtime, so a few threads are enough.
      LLAMA_THREADS: "${LLAMA_EMBEDDING_THREADS:-4}"

  llama-reranker:
    <<: *llama-server
    container_name: llama_reranker_cpu
    ports:
      - "${LLAMA_RERANKER_PORT:-11435}:8080"
    environment:
      LLAMA_MODEL: "/models/${LLAMA_RERANKER_MODEL:-qwen3-reranker-4b-f16.gguf}"
      LLAMA_ROLE_PROTOCOL: "${LLAMA_RERANKER_PROTOCOL:-completion_logprobs}"
      # One slot keeps the shared system/instruction/query prefix cached between candidates.
      LLAMA_PARALLEL: "${LLAMA_RERANKER_PARALLEL:-1}"
      LLAMA_CONTEXT_PER_SLOT: "${LLAMA_RERANKER_CONTEXT_PER_SLOT:-4096}"
      LLAMA_BATCH_SIZE: "${LLAMA_RERANKER_BATCH_SIZE:-4096}"
      LLAMA_UBATCH_SIZE: "${LLAMA_RERANKER_UBATCH_SIZE:-512}"
      # Prompt processing dominates reranking; give it the performance-core threads.
      LLAMA_THREADS: "${LLAMA_RERANKER_THREADS:-8}"
      LLAMA_SLOT_PROMPT_SIMILARITY: "0.1"

  postgres:
    image: postgres:17.0-alpine
    container_name: postgres_local
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-thesis}"
      POSTGRES_USER: "${POSTGRES_USER:-thesis}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-thesis}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: qdrant_local
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has bash but no curl or wget.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend-migrate:
    <<: *backend
    container_name: pharma_agent_migrate
    command: ["pharma-agent", "migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    container_name: pharma_agent_backend
    command: ["pharma-agent", "serve"]
    restart: unless-stopped
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      llama-embedding:
        condition: service_healthy
      llama-reranker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BACKEND_PORT:-8000}/api/v1/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  qdrant_data:
